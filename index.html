<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSB 盲评标注器 — 多维表格插件版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown-light.css">
    <!-- Base JS SDK (前端插件核心) -->
    <script src="https://lf-cdn.larkoffice.com/obj/lark-base-open/js-sdk/latest/base-js-sdk.umd.js"></script>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-light: #eef1fe;
            --good: #16a34a;
            --good-bg: #f0fdf4;
            --same: #ca8a04;
            --same-bg: #fefce8;
            --bad: #dc2626;
            --bad-bg: #fef2f2;
            --uncertain-bg: #fff7ed;
            --uncertain: #ea580c;
            --invalid-bg: #faf5ff;
            --invalid: #9333ea;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --text: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08);
            --sync: #0891b2;
            --sync-bg: #ecfeff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Tahoma, 'PingFang SC', 'Microsoft Yahei', Arial, 'Hiragino Sans GB', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
        }
        /* Dark mode support for Bitable */
        body.dark-mode { --bg: #1a1a1a; --text: #e2e8f0; --text-secondary: #94a3b8; --border: #374151; --primary-light: #1e2a4a; }
        body.dark-mode .case-card, body.dark-mode .source-panel, body.dark-mode .field-mapping { background: #252525; }
        body.dark-mode .gsb-btn, body.dark-mode .extra-btn { background: #2d2d2d; }
        body.dark-mode .btn-outline, body.dark-mode .nav-btn { background: #2d2d2d; }
        body.dark-mode .form-input, body.dark-mode select { background: #2d2d2d; color: var(--text); }

        .header { background: linear-gradient(135deg, #4f6ef7 0%, #6366f1 100%); color: #fff; padding: 20px 16px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(79,110,247,.3); }
        .header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
        .header .subtitle { font-size: 12px; opacity: .85; margin-top: 3px; }

        .stats-bar { display: flex; justify-content: center; gap: 14px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
        .stats-bar .stat-item span { font-weight: 700; color: var(--text); margin-left: 3px; }
        .sync-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .sync-indicator.connected { background: var(--sync-bg); color: var(--sync); }
        .sync-indicator.disconnected { background: var(--bg); color: var(--text-secondary); }
        .sync-dot { width: 6px; height: 6px; border-radius: 50%; }
        .sync-dot.on { background: var(--sync); animation: pulse 2s infinite; }
        .sync-dot.off { background: #cbd5e1; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

        .container { max-width: 100%; margin: 0 auto; padding: 16px 14px 60px; }

        /* ===== Source Selection ===== */
        .source-section { margin: 0 auto; }
        .source-tabs { display: flex; gap: 0; background: var(--bg); border-radius: 10px 10px 0 0; border: 1px solid var(--border); border-bottom: none; overflow: hidden; }
        .source-tab { flex: 1; padding: 11px 12px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-secondary); border-right: 1px solid var(--border); transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .source-tab:last-child { border-right: none; }
        .source-tab.active { color: var(--primary); background: var(--primary-light); }
        .source-tab:hover:not(.active) { background: var(--bg); }
        .source-tab svg { width: 16px; height: 16px; }
        .source-panel { border: 1px solid var(--border); border-radius: 0 0 10px 10px; background: #fff; padding: 20px 16px; display: none; }
        .source-panel.active { display: block; }

        /* Bitable form */
        .bitable-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text); }
        .form-group .hint { font-size: 11px; color: var(--text-secondary); }
        .form-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; transition: border .15s; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.1); }

        /* Field Mapping */
        .field-mapping { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--bg); }
        .field-mapping h4 { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; color: var(--text); }
        .mapping-grid { display: flex; flex-direction: column; gap: 6px; }
        .mapping-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .mapping-item .label { min-width: 80px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; }
        .mapping-item select { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: #fff; cursor: pointer; }
        .mapping-item select:focus { outline: none; border-color: var(--primary); }

        .writeback-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

        .btn-connect { width: 100%; padding: 10px; border-radius: 8px; background: var(--primary); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-connect:hover { background: #4060e0; }
        .btn-connect:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-connect.loading { position: relative; color: transparent; }
        .btn-connect.loading::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin .6s linear infinite; left: 50%; top: 50%; margin: -8px 0 0 -8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .connection-status { padding: 8px 12px; border-radius: 8px; font-size: 12px; display: none; margin-top: 6px; }
        .connection-status.success { display: block; background: var(--good-bg); color: var(--good); }
        .connection-status.error { display: block; background: var(--bad-bg); color: var(--bad); }

        /* File Upload */
        .upload-box { border: 2px dashed var(--border); border-radius: 10px; padding: 30px 20px; text-align: center; transition: all .2s; cursor: pointer; }
        .upload-box:hover, .upload-box.dragover { border-color: var(--primary); background: var(--primary-light); }
        .upload-box svg { width: 36px; height: 36px; color: var(--primary); margin-bottom: 8px; }
        .upload-box h3 { font-size: 14px; margin-bottom: 3px; }
        .upload-box p { font-size: 12px; color: var(--text-secondary); }
        .upload-box .note { margin-top: 10px; padding: 8px 12px; background: #fffbeb; border-radius: 6px; font-size: 11px; color: #92400e; text-align: left; }

        /* ===== Toolbar ===== */
        .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all .15s; white-space: nowrap; }
        .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--bg); }
        .btn-export { background: #059669; color: #fff; }
        .btn-export:hover { background: #047857; }
        .btn-sync { background: var(--sync); color: #fff; }
        .btn-sync:hover { background: #0e7490; }
        .btn-sync:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-reset { background: #fff; color: var(--bad); border: 1px solid #fecaca; font-size: 12px; padding: 6px 12px; }
        .btn-reset:hover { background: var(--bad-bg); }

        .auto-sync-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); font-weight: 500; cursor: pointer; padding: 4px 10px; border-radius: 6px; background: #fff; border: 1px solid var(--border); white-space: nowrap; }
        .auto-sync-toggle input { accent-color: var(--sync); }

        .nav-group { display: flex; align-items: center; gap: 4px; }
        .nav-btn { width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
        .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
        .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
        .nav-info { font-size: 12px; color: var(--text-secondary); min-width: 60px; text-align: center; }

        .filter-group { display: flex; gap: 3px; background: var(--bg); padding: 2px; border-radius: 7px; flex-wrap: wrap; }
        .filter-btn { padding: 4px 10px; border-radius: 5px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; background: transparent; color: var(--text-secondary); transition: all .15s; white-space: nowrap; }
        .filter-btn.active { background: #fff; color: var(--text); box-shadow: var(--shadow); }

        /* ===== Case Card ===== */
        .case-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; border: 1px solid var(--border); }
        .case-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg); gap: 8px; }
        .case-meta { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
        .case-id { font-size: 11px; color: var(--text-secondary); word-break: break-all; }
        .case-query { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-word; }

        .badge-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
        .badge { padding: 2px 8px; border-radius: 16px; font-size: 10px; font-weight: 600; white-space: nowrap; }
        .badge-pending { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
        .badge-done { background: var(--good-bg); color: var(--good); }
        .badge-uncertain { background: var(--uncertain-bg); color: var(--uncertain); }
        .badge-invalid { background: var(--invalid-bg); color: var(--invalid); }
        .badge-synced { background: var(--sync-bg); color: var(--sync); }
        .badge-sync-pending { background: #fffbeb; color: #ca8a04; }

        .results-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
        .result-panel { padding: 14px; border-bottom: 1px solid var(--border); min-height: 120px; }
        .result-panel:last-child { border-bottom: none; }
        .result-label { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; margin-bottom: 8px; letter-spacing: .5px; }
        .label-a { background: #dbeafe; color: #1d4ed8; }
        .label-b { background: #fce7f3; color: #be185d; }

        .md-content { font-size: 13px; line-height: 1.7; max-height: 320px; overflow-y: auto; padding-right: 6px; }
        .md-content::-webkit-scrollbar { width: 4px; }
        .md-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .md-content h1, .md-content h2, .md-content h3, .md-content h4 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; border: none; padding-bottom: 0; }
        .md-content h1 { font-size: 18px; } .md-content h2 { font-size: 16px; } .md-content h3 { font-size: 14px; }
        .md-content p { margin-bottom: 8px; }
        .md-content ul, .md-content ol { padding-left: 18px; margin-bottom: 8px; }
        .md-content li { margin-bottom: 3px; }
        .md-content code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 12px; color: #e11d48; }
        .md-content pre { background: #1e293b; color: #e2e8f0; padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 10px; }
        .md-content pre code { background: transparent; color: inherit; padding: 0; }
        .md-content blockquote { border-left: 3px solid var(--primary); padding: 6px 12px; margin: 8px 0; background: var(--primary-light); border-radius: 0 6px 6px 0; }
        .md-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
        .md-content th, .md-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
        .md-content th { background: var(--bg); font-weight: 600; }
        .md-content img { max-width: 100%; border-radius: 6px; }
        .md-content a { color: var(--primary); text-decoration: none; }
        .md-content a:hover { text-decoration: underline; }

        .annotation-bar { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
        .gsb-group { display: flex; gap: 6px; }
        .gsb-btn { padding: 7px 16px; border-radius: 7px; border: 2px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; }
        .gsb-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .gsb-btn.good { border-color: transparent; }
        .gsb-btn.good:hover, .gsb-btn.good.selected { background: var(--good-bg); border-color: var(--good); color: var(--good); }
        .gsb-btn.same { border-color: transparent; }
        .gsb-btn.same:hover, .gsb-btn.same.selected { background: var(--same-bg); border-color: var(--same); color: var(--same); }
        .gsb-btn.bad { border-color: transparent; }
        .gsb-btn.bad:hover, .gsb-btn.bad.selected { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
        .gsb-btn .key-hint { font-size: 9px; color: var(--text-secondary); margin-left: 3px; opacity: .6; }

        .divider { width: 1px; height: 24px; background: var(--border); }

        .extra-btn { padding: 7px 12px; border-radius: 7px; border: 2px solid transparent; background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-secondary); transition: all .2s; }
        .uncertain-btn:hover, .uncertain-btn.selected { background: var(--uncertain-bg); border-color: var(--uncertain); color: var(--uncertain); }
        .invalid-btn:hover, .invalid-btn.selected { background: var(--invalid-bg); border-color: var(--invalid); color: var(--invalid); }

        .reason-box { padding: 10px 14px 12px; border-top: 1px solid var(--border); display: none; }
        .reason-box.show { display: block; }
        .reason-box.uncertain-reason { background: var(--uncertain-bg); }
        .reason-box.invalid-reason { background: #faf5ff; }
        .reason-box textarea { width: 100%; min-height: 50px; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; font-size: 12px; resize: vertical; font-family: inherit; background: #fff; }
        .reason-box textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
        .reason-box label { font-size: 11px; font-weight: 600; margin-bottom: 4px; display: block; }
        .reason-box.uncertain-reason label { color: var(--uncertain); }
        .reason-box.invalid-reason label { color: var(--invalid); }

        .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #6366f1); border-radius: 2px; transition: width .3s; }

        .empty-state { text-align: center; padding: 40px 16px; color: var(--text-secondary); font-size: 13px; }

        .toast { position: fixed; bottom: 16px; right: 16px; left: 16px; padding: 10px 16px; background: #1e293b; color: #fff; border-radius: 8px; font-size: 12px; font-weight: 500; z-index: 1000; opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; text-align: center; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--bad); }
        .toast.success { background: var(--good); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
        .modal h3 { font-size: 15px; margin-bottom: 12px; }
        .modal .btn-group { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

        .jump-input { width: 40px; text-align: center; border: 1px solid var(--border); border-radius: 5px; padding: 3px; font-size: 12px; font-weight: 600; }
        .jump-input:focus { outline: none; border-color: var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <h1>Agent 知识库评测打标盲评平台</h1>
    <div class="subtitle">多维表格插件版 — 数据直连 · 实时回写</div>
</div>

<div id="statsBar" class="stats-bar" style="display:none">
    <div class="stat-item">总: <span id="totalCount">0</span></div>
    <div class="stat-item">已标: <span id="doneCount">0</span></div>
    <div class="stat-item">难判: <span id="uncertainCount">0</span></div>
    <div class="stat-item">不适: <span id="invalidCount">0</span></div>
    <div class="stat-item">
        <div class="progress-bar" style="width:80px; display:inline-block; vertical-align:middle;">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span id="progressPct">0%</span>
    </div>
    <div class="stat-item" id="syncStatusItem" style="display:none">
        <div class="sync-indicator" id="syncIndicator">
            <div class="sync-dot" id="syncDot"></div>
            <span id="syncStatusText">未连接</span>
        </div>
    </div>
</div>

<div class="container">
    <!-- ===== Source Selection ===== -->
    <div id="sourceSection" class="source-section">
        <div class="source-tabs">
            <div class="source-tab active" data-tab="bitable" onclick="switchSourceTab('bitable')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" /></svg>
                当前多维表
            </div>
            <div class="source-tab" data-tab="file" onclick="switchSourceTab('file')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                上传 Excel
            </div>
        </div>

        <!-- Tab 1: Bitable (默认) -->
        <div class="source-panel active" id="panel-bitable">
            <div class="bitable-form">
                <div id="btConnectArea">
                    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">
                        自动读取当前打开的多维表数据，标注结果实时回写。无需 Token。
                    </p>
                    <button class="btn-connect" id="btnConnect" onclick="connectBitable()">连接当前数据表并获取字段</button>
                    <div class="connection-status" id="connectionStatus"></div>
                </div>

                <div id="fieldMappingSection" style="display:none">
                    <div class="field-mapping">
                        <h4>📖 读取字段映射</h4>
                        <div class="mapping-grid" id="readMappingGrid"></div>

                        <div class="writeback-section">
                            <h4>📤 回写字段映射 <span style="font-weight:400;color:var(--text-secondary);font-size:10px">（字段不存在需先在表中创建）</span></h4>
                            <div class="mapping-grid" id="writeMappingGrid"></div>
                        </div>
                    </div>
                    <button class="btn-connect" id="btnLoadData" onclick="loadBitableData()" style="margin-top:12px; background:#059669;">
                        加载数据并开始标注
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab 2: File Upload -->
        <div class="source-panel" id="panel-file">
            <div class="upload-box" id="uploadBox">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                <h3>点击或拖拽上传 Excel</h3>
                <p>支持 .xlsx / .xls</p>
                <div class="note">⚠️ 最多解析 1000 行<br>必需列：QueryID、Query、LogID、BaseResult、PrismResult</div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
        </div>
    </div>

    <!-- ===== Main Annotation Content ===== -->
    <div id="mainContent" style="display:none">
        <div class="toolbar">
            <div class="toolbar-row">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="pending">待标</button>
                    <button class="filter-btn" data-filter="done">已标</button>
                    <button class="filter-btn" data-filter="uncertain">难判</button>
                    <button class="filter-btn" data-filter="invalid">不适</button>
                </div>
                <div class="nav-group">
                    <button class="nav-btn" id="prevBtn" title="← 上一条">‹</button>
                    <div class="nav-info">
                        <input type="text" class="jump-input" id="jumpInput" title="输入序号回车跳转"> / <span id="filteredTotal">0</span>
                    </div>
                    <button class="nav-btn" id="nextBtn" title="→ 下一条">›</button>
                </div>
            </div>
            <div class="toolbar-row">
                <label class="auto-sync-toggle" id="autoSyncLabel" style="display:none">
                    <input type="checkbox" id="autoSyncCheckbox" checked> 自动回写
                </label>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <button class="btn btn-sync" id="btnSyncAll" style="display:none" onclick="syncAllToBitable()">
                        ⟳ 批量同步
                    </button>
                    <button class="btn btn-export" onclick="exportResults()">↓ 导出</button>
                    <button class="btn btn-reset" onclick="confirmReset()">重置</button>
                </div>
            </div>
        </div>
        <div id="caseContainer"></div>
        <div id="emptyState" class="empty-state" style="display:none">
            <p>当前筛选条件下没有数据</p>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="resetModal">
    <div class="modal">
        <h3>确认重置</h3>
        <p style="color:var(--text-secondary); font-size:13px;">将清除所有数据和标注记录。</p>
        <div class="btn-group">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn" style="background:var(--bad);color:#fff;" onclick="doReset()">确认重置</button>
        </div>
    </div>
</div>

<script>
// ======================== STATE ========================
let allCases = [];
let currentFilter = 'all';
let currentIndex = 0;
let dataSource = 'file'; // 'file' | 'bitable'

// Bitable state (via JS SDK)
const btState = {
    connected: false,
    table: null,        // JS SDK table object
    fieldMetaList: [],  // [{id, name, type}]
    readMapping: {},    // { queryId: fieldName, ... }
    writeMapping: {},   // { conclusion: fieldName, ... }
};

const bitable = window.bitable || (window.base && window.base.bitable) || null;

const READ_FIELDS = [
    { key: 'queryId',     label: 'QueryID',     required: true },
    { key: 'query',       label: 'Query',        required: true },
    { key: 'logId',       label: 'LogID',        required: false },
    { key: 'baseResult',  label: 'BaseResult',   required: true },
    { key: 'prismResult', label: 'PrismResult',  required: true }
];

const WRITE_FIELDS = [
    { key: 'conclusion',       label: 'BaseVsPrism结论',  defaultNames: ['BaseVsPrism结论', 'Base vs Prism 结论', '结论'] },
    { key: 'status',           label: '标注状态',          defaultNames: ['标注状态', '状态'] },
    { key: 'blindChoice',      label: '盲评选择',          defaultNames: ['盲评选择', '盲评选择(AB维度)'] },
    { key: 'uncertainFlag',    label: '不易判断',          defaultNames: ['不易判断', '是否不易判断'] },
    { key: 'uncertainReason',  label: '不易判断原因',      defaultNames: ['不易判断原因'] },
    { key: 'invalidFlag',     label: '不合适',            defaultNames: ['不合适', '是否不合适'] },
    { key: 'invalidReason',   label: '不合适原因',        defaultNames: ['不合适原因'] }
];

const COLUMN_ALIASES = {
    queryId:     ['QueryID', 'AE QueryID', 'AEQueryID', 'queryid'],
    query:       ['Query', 'query', 'QUERY'],
    logId:       ['LogID', 'logid', 'LogId'],
    baseResult:  ['BaseResult', 'baseresult', 'Base Result'],
    prismResult: ['PrismResult', 'prismresult', 'Prism Result']
};

function findColumn(headers, aliases) {
    for (const a of aliases) { const f = headers.find(h => h && h.trim() === a); if (f) return f; }
    for (const a of aliases) { const f = headers.find(h => h && h.trim().toLowerCase() === a.toLowerCase()); if (f) return f; }
    return null;
}

// ======================== THEME (Bitable dark mode) ========================
async function initTheme() {
    if (!bitable) return;
    try {
        const theme = await bitable.bridge.getTheme();
        document.body.classList.toggle('dark-mode', theme === 'DARK');
        bitable.bridge.onThemeChange((ev) => {
            document.body.classList.toggle('dark-mode', ev.data.theme === 'DARK');
        });
    } catch(e) { /* not in bitable env */ }
}
initTheme();

// ======================== SOURCE TAB ========================
function switchSourceTab(tab) {
    document.querySelectorAll('.source-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.source-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
}

// ======================== FILE UPLOAD ========================
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
uploadBox.addEventListener('click', () => fileInput.click());
uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', e => { e.preventDefault(); uploadBox.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
    if (!/\.xlsx?$/i.test(file.name)) return showToast('请上传 .xlsx 或 .xls 文件', 'error');
    const reader = new FileReader();
    reader.onload = e => parseExcel(e.target.result);
    reader.readAsArrayBuffer(file);
}

function parseExcel(buffer) {
    try {
        const wb = XLSX.read(buffer, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        if (!json.length) return showToast('Excel 文件为空', 'error');

        const headers = Object.keys(json[0]);
        const colMap = {};
        const missing = [];
        for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
            const found = findColumn(headers, aliases);
            if (found) colMap[key] = found; else missing.push(aliases[0]);
        }
        if (missing.length) return showToast('缺少必需列: ' + missing.join(', '), 'error');

        const maxRows = Math.min(json.length, 1000);
        allCases = [];
        for (let i = 0; i < maxRows; i++) {
            const row = json[i];
            allCases.push(createCase(i, {
                queryId: String(row[colMap.queryId] || ''),
                query: String(row[colMap.query] || ''),
                logId: String(row[colMap.logId] || ''),
                baseResult: String(row[colMap.baseResult] || ''),
                prismResult: String(row[colMap.prismResult] || '')
            }));
        }
        dataSource = 'file';
        enterAnnotationMode();
        showToast(`加载 ${allCases.length} 条用例`, 'success');
    } catch (err) { showToast('解析失败: ' + err.message, 'error'); }
}

function createCase(idx, data) {
    return {
        idx, ...data,
        recordId: data.recordId || null,
        swapped: Math.random() < 0.5,
        annotation: null, uncertain: false, uncertainReason: '',
        invalid: false, invalidReason: '',
        synced: false, lastSyncTime: null
    };
}

// ======================== BITABLE JS SDK CONNECTION ========================
async function connectBitable() {
    const btn = document.getElementById('btnConnect');
    const statusEl = document.getElementById('connectionStatus');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = '';
    statusEl.className = 'connection-status';
    statusEl.style.display = 'none';

    try {
        if (!bitable) throw new Error('未检测到 Base JS SDK。请确保此页面运行在多维表格插件环境中。');

        const table = await bitable.base.getActiveTable();
        btState.table = table;

        // 获取所有字段的 meta 信息
        const fieldMetaList = await table.getFieldMetaList();
        btState.fieldMetaList = fieldMetaList;
        btState.connected = true;

        const tableName = await table.getName();
        statusEl.className = 'connection-status success';
        statusEl.textContent = `✅ 已连接「${tableName}」，共 ${fieldMetaList.length} 个字段`;

        buildFieldMapping(fieldMetaList);
        document.getElementById('fieldMappingSection').style.display = 'block';
    } catch (err) {
        statusEl.className = 'connection-status error';
        statusEl.textContent = `❌ ${err.message}`;
        btState.connected = false;
    } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = '连接当前数据表并获取字段';
    }
}

function buildFieldMapping(fieldMetaList) {
    const fieldNames = fieldMetaList.map(f => f.name);

    // Read mapping
    const readGrid = document.getElementById('readMappingGrid');
    readGrid.innerHTML = '';
    for (const rf of READ_FIELDS) {
        const guessed = guessFieldMatch(rf.key, fieldNames);
        readGrid.innerHTML += `
            <div class="mapping-item">
                <span class="label">${rf.label}${rf.required ? ' *' : ''}</span>
                <select id="readMap_${rf.key}" onchange="updateReadMapping()">
                    <option value="">-- 不映射 --</option>
                    ${fieldNames.map(fn => `<option value="${esc(fn)}" ${fn === guessed ? 'selected' : ''}>${esc(fn)}</option>`).join('')}
                </select>
            </div>`;
    }
    updateReadMapping();

    // Write mapping
    const writeGrid = document.getElementById('writeMappingGrid');
    writeGrid.innerHTML = '';
    for (const wf of WRITE_FIELDS) {
        const guessed = guessWriteFieldMatch(wf.defaultNames, fieldNames);
        writeGrid.innerHTML += `
            <div class="mapping-item">
                <span class="label">${wf.label}</span>
                <select id="writeMap_${wf.key}" onchange="updateWriteMapping()">
                    <option value="">-- 不回写 --</option>
                    ${fieldNames.map(fn => `<option value="${esc(fn)}" ${fn === guessed ? 'selected' : ''}>${esc(fn)}</option>`).join('')}
                </select>
            </div>`;
    }
    updateWriteMapping();
}

function guessFieldMatch(key, fieldNames) {
    const aliases = COLUMN_ALIASES[key] || [key];
    for (const a of aliases) {
        const match = fieldNames.find(fn => fn.toLowerCase() === a.toLowerCase());
        if (match) return match;
    }
    for (const a of aliases) {
        const match = fieldNames.find(fn => fn.toLowerCase().includes(a.toLowerCase()));
        if (match) return match;
    }
    return '';
}

function guessWriteFieldMatch(defaultNames, fieldNames) {
    for (const dn of defaultNames) {
        const exact = fieldNames.find(fn => fn === dn);
        if (exact) return exact;
    }
    for (const dn of defaultNames) {
        const match = fieldNames.find(fn => fn.toLowerCase().includes(dn.toLowerCase()) || dn.toLowerCase().includes(fn.toLowerCase()));
        if (match) return match;
    }
    return '';
}

function updateReadMapping() {
    READ_FIELDS.forEach(rf => {
        const sel = document.getElementById('readMap_' + rf.key);
        if (sel) btState.readMapping[rf.key] = sel.value;
    });
}
function updateWriteMapping() {
    WRITE_FIELDS.forEach(wf => {
        const sel = document.getElementById('writeMap_' + wf.key);
        if (sel) btState.writeMapping[wf.key] = sel.value;
    });
}

async function loadBitableData() {
    const missing = READ_FIELDS.filter(rf => rf.required && !btState.readMapping[rf.key]);
    if (missing.length) return showToast('请映射必需字段: ' + missing.map(f => f.label).join(', '), 'error');

    const btn = document.getElementById('btnLoadData');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = '';

    try {
        const table = btState.table;
        // 使用批量 getRecords 接口
        const recordIdList = await table.getRecordIdList();
        if (!recordIdList.length) return showToast('表中无数据', 'error');

        // 解析字段名 -> 字段对象映射 (用于读取值)
        const fieldNameToMeta = {};
        btState.fieldMetaList.forEach(f => { fieldNameToMeta[f.name] = f; });

        // 获取需要读取的字段对象
        const readFieldObjs = {};
        for (const rf of READ_FIELDS) {
            const fname = btState.readMapping[rf.key];
            if (fname && fieldNameToMeta[fname]) {
                readFieldObjs[rf.key] = await table.getField(fieldNameToMeta[fname].id);
            }
        }

        // 批量读取 records (使用 getRecords 批量接口)
        allCases = [];
        const batchSize = 500;
        for (let i = 0; i < recordIdList.length; i += batchSize) {
            const batchIds = recordIdList.slice(i, i + batchSize);
            // 逐条读取字段值（JS SDK 的 getRecords 可用时批量获取更快）
            for (const recId of batchIds) {
                const rowData = {};
                for (const rf of READ_FIELDS) {
                    if (readFieldObjs[rf.key]) {
                        try {
                            const val = await readFieldObjs[rf.key].getValue(recId);
                            rowData[rf.key] = extractTextValue(val);
                        } catch { rowData[rf.key] = ''; }
                    } else {
                        rowData[rf.key] = '';
                    }
                }
                rowData.recordId = recId;
                allCases.push(createCase(allCases.length, rowData));
            }
            // 更新进度
            if (recordIdList.length > batchSize) {
                btn.textContent = `加载中... ${Math.min(i + batchSize, recordIdList.length)}/${recordIdList.length}`;
                btn.classList.remove('loading');
            }
        }

        dataSource = 'bitable';
        enterAnnotationMode();
        showToast(`从多维表加载 ${allCases.length} 条数据`, 'success');
    } catch (err) {
        showToast('加载失败: ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = '加载数据并开始标注';
    }
}

// 从 JS SDK 返回的各种 cell value 中提取纯文本
function extractTextValue(val) {
    if (val === null || val === undefined) return '';
    if (typeof val === 'string') return val;
    if (typeof val === 'number' || typeof val === 'boolean') return String(val);
    if (Array.isArray(val)) {
        return val.map(item => {
            if (typeof item === 'string') return item;
            if (item && item.text) return item.text;
            if (item && item.name) return item.name;
            return JSON.stringify(item);
        }).join('');
    }
    if (val && val.text) return val.text;
    return JSON.stringify(val);
}

// ======================== ENTER ANNOTATION MODE ========================
function enterAnnotationMode() {
    document.getElementById('sourceSection').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('statsBar').style.display = 'flex';

    const isBitable = dataSource === 'bitable' && btState.connected;
    document.getElementById('syncStatusItem').style.display = isBitable ? 'inline-flex' : 'none';
    document.getElementById('btnSyncAll').style.display = isBitable ? 'inline-flex' : 'none';
    document.getElementById('autoSyncLabel').style.display = isBitable ? 'flex' : 'none';

    if (isBitable) {
        document.getElementById('syncDot').className = 'sync-dot on';
        document.getElementById('syncIndicator').className = 'sync-indicator connected';
        document.getElementById('syncStatusText').textContent = '已连接';
    }

    currentFilter = 'all';
    currentIndex = 0;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
    renderCurrent();
    updateStats();
}

// ======================== SYNC TO BITABLE (JS SDK) ========================
function buildWriteBackFields(c) {
    const wm = btState.writeMapping;
    const fields = {};

    const aLabel = c.swapped ? 'PrismResult' : 'BaseResult';
    const bLabel = c.swapped ? 'BaseResult' : 'PrismResult';

    let baseVsPrism = '';
    if (c.annotation && !c.uncertain && !c.invalid) {
        let winner = c.annotation === 'good' ? aLabel : c.annotation === 'bad' ? bLabel : 'Same';
        baseVsPrism = winner === 'BaseResult' ? 'Base更好' : winner === 'PrismResult' ? 'Prism更好' : '一样好';
    }

    let status = '未标注';
    if (c.invalid) status = '不合适';
    else if (c.uncertain) status = '不易判断';
    else if (c.annotation) status = '已标注';

    let blindChoice = '';
    if (c.annotation === 'good') blindChoice = 'A更好';
    else if (c.annotation === 'bad') blindChoice = 'B更好';
    else if (c.annotation === 'same') blindChoice = '一样好';

    if (wm.conclusion) fields[wm.conclusion] = baseVsPrism;
    if (wm.status) fields[wm.status] = status;
    if (wm.blindChoice) fields[wm.blindChoice] = blindChoice;
    if (wm.uncertainFlag) fields[wm.uncertainFlag] = c.uncertain ? '是' : '否';
    if (wm.uncertainReason) fields[wm.uncertainReason] = c.uncertainReason || '';
    if (wm.invalidFlag) fields[wm.invalidFlag] = c.invalid ? '是' : '否';
    if (wm.invalidReason) fields[wm.invalidReason] = c.invalidReason || '';

    return fields;
}

async function syncSingleRecord(c) {
    if (!btState.connected || !c.recordId || !btState.table) return;
    const hasWriteField = Object.values(btState.writeMapping).some(v => v);
    if (!hasWriteField) return;

    const writeData = buildWriteBackFields(c);
    const table = btState.table;
    const fieldNameToMeta = {};
    btState.fieldMetaList.forEach(f => { fieldNameToMeta[f.name] = f; });

    for (const [fieldName, value] of Object.entries(writeData)) {
        if (!fieldName) continue;
        const meta = fieldNameToMeta[fieldName];
        if (!meta) continue;
        try {
            const field = await table.getField(meta.id);
            await field.setValue(c.recordId, value);
        } catch (err) {
            console.warn(`回写字段 [${fieldName}] 失败:`, err);
        }
    }
    c.synced = true;
    c.lastSyncTime = new Date();
}

async function autoSyncIfEnabled(c) {
    if (dataSource !== 'bitable' || !btState.connected) return;
    if (!document.getElementById('autoSyncCheckbox').checked) {
        c.synced = false;
        return;
    }
    try {
        await syncSingleRecord(c);
    } catch (err) {
        showToast('自动回写失败: ' + err.message, 'error');
    }
    renderCurrent();
}

async function syncAllToBitable() {
    if (!btState.connected) return showToast('未连接多维表', 'error');
    const hasWriteField = Object.values(btState.writeMapping).some(v => v);
    if (!hasWriteField) return showToast('未配置回写字段', 'error');

    const toSync = allCases.filter(c => c.recordId && (c.annotation || c.uncertain || c.invalid) && !c.synced);
    if (!toSync.length) return showToast('没有待同步数据');

    const btn = document.getElementById('btnSyncAll');
    btn.disabled = true;
    let success = 0, failed = 0;

    // 使用 setRecords 批量接口（如果 table 支持）
    // 先尝试批量方式
    try {
        const table = btState.table;
        const fieldNameToMeta = {};
        btState.fieldMetaList.forEach(f => { fieldNameToMeta[f.name] = f; });

        // 构建按字段分组的批量更新
        const writeFieldNames = Object.values(btState.writeMapping).filter(v => v);
        
        for (const c of toSync) {
            try {
                await syncSingleRecord(c);
                success++;
            } catch {
                failed++;
            }
            btn.textContent = `⟳ ${success}/${toSync.length}`;
        }
    } catch (err) {
        showToast('批量同步出错: ' + err.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = '⟳ 批量同步';

    if (failed) showToast(`同步: ${success} 成功, ${failed} 失败`, 'error');
    else showToast(`${success} 条记录同步成功`, 'success');
    renderCurrent();
}

// ======================== FILTER & NAV ========================
function getFiltered() {
    if (currentFilter === 'all') return allCases;
    if (currentFilter === 'pending') return allCases.filter(c => !c.annotation && !c.uncertain && !c.invalid);
    if (currentFilter === 'done') return allCases.filter(c => c.annotation && !c.uncertain && !c.invalid);
    if (currentFilter === 'uncertain') return allCases.filter(c => c.uncertain);
    if (currentFilter === 'invalid') return allCases.filter(c => c.invalid);
    return allCases;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        currentIndex = 0;
        renderCurrent();
    });
});

document.getElementById('prevBtn').addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderCurrent(); } });
document.getElementById('nextBtn').addEventListener('click', () => { const f = getFiltered(); if (currentIndex < f.length - 1) { currentIndex++; renderCurrent(); } });
document.getElementById('jumpInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const val = parseInt(e.target.value), filtered = getFiltered();
        if (val >= 1 && val <= filtered.length) { currentIndex = val - 1; renderCurrent(); }
        else showToast('请输入 1 ~ ' + filtered.length);
    }
});

// ======================== RENDER ========================
function renderCurrent() {
    const filtered = getFiltered();
    const container = document.getElementById('caseContainer');
    const empty = document.getElementById('emptyState');
    document.getElementById('filteredTotal').textContent = filtered.length;

    if (!filtered.length) {
        container.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('jumpInput').value = '0';
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        return;
    }
    empty.style.display = 'none';
    if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;

    document.getElementById('jumpInput').value = currentIndex + 1;
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex >= filtered.length - 1;

    const c = filtered[currentIndex];
    const resultA = c.swapped ? c.prismResult : c.baseResult;
    const resultB = c.swapped ? c.baseResult : c.prismResult;

    let statusBadge;
    if (c.invalid) statusBadge = '<span class="badge badge-invalid">不合适</span>';
    else if (c.uncertain) statusBadge = '<span class="badge badge-uncertain">不易判断</span>';
    else if (c.annotation) statusBadge = '<span class="badge badge-done">已标注</span>';
    else statusBadge = '<span class="badge badge-pending">待标注</span>';

    let syncBadge = '';
    if (dataSource === 'bitable' && btState.connected && c.recordId) {
        if (c.synced) syncBadge = '<span class="badge badge-synced">✓ 已同步</span>';
        else if (c.annotation || c.uncertain || c.invalid) syncBadge = '<span class="badge badge-sync-pending">⏳ 待同步</span>';
    }

    const gsbSel = v => c.annotation === v && !c.uncertain && !c.invalid ? 'selected' : '';

    container.innerHTML = `
        <div class="case-card">
            <div class="case-header">
                <div class="case-meta">
                    <div class="case-id">QueryID: <strong>${esc(c.queryId)}</strong> | #${c.idx+1}</div>
                    <div class="case-query">${esc(c.query)}</div>
                </div>
                <div class="badge-group">${syncBadge}${statusBadge}</div>
            </div>
            <div class="results-grid">
                <div class="result-panel">
                    <span class="result-label label-a">回答 A</span>
                    <div class="md-content markdown-body">${renderMd(resultA)}</div>
                </div>
                <div class="result-panel">
                    <span class="result-label label-b">回答 B</span>
                    <div class="md-content markdown-body">${renderMd(resultB)}</div>
                </div>
            </div>
            <div class="annotation-bar">
                <div class="gsb-group">
                    <button class="gsb-btn good ${gsbSel('good')}" onclick="annotate('good')" title="快捷键 1">👍 A好 <span class="key-hint">[1]</span></button>
                    <button class="gsb-btn same ${gsbSel('same')}" onclick="annotate('same')" title="快捷键 2">🤝 一样 <span class="key-hint">[2]</span></button>
                    <button class="gsb-btn bad ${gsbSel('bad')}" onclick="annotate('bad')" title="快捷键 3">👎 B好 <span class="key-hint">[3]</span></button>
                </div>
                <div class="divider"></div>
                <button class="extra-btn uncertain-btn ${c.uncertain ? 'selected' : ''}" onclick="toggleUncertain()" title="快捷键 4">🤔 难判 <span class="key-hint">[4]</span></button>
                <button class="extra-btn invalid-btn ${c.invalid ? 'selected' : ''}" onclick="toggleInvalid()" title="快捷键 5">🚫 不适 <span class="key-hint">[5]</span></button>
            </div>
            <div class="reason-box uncertain-reason ${c.uncertain ? 'show' : ''}" id="uncertainReasonBox">
                <label>不易判断原因</label>
                <textarea placeholder="输入原因..." oninput="saveUncertainReason(this.value)">${esc(c.uncertainReason)}</textarea>
            </div>
            <div class="reason-box invalid-reason ${c.invalid ? 'show' : ''}" id="invalidReasonBox">
                <label>不合适原因</label>
                <textarea placeholder="输入原因..." oninput="saveInvalidReason(this.value)">${esc(c.invalidReason)}</textarea>
            </div>
        </div>`;
}

// ======================== ANNOTATION ========================
function annotate(val) {
    const filtered = getFiltered();
    if (!filtered.length) return;
    const c = filtered[currentIndex];
    if (c.annotation === val) { c.annotation = null; c.synced = false; }
    else { c.annotation = val; c.uncertain = false; c.uncertainReason = ''; c.invalid = false; c.invalidReason = ''; c.synced = false; }
    renderCurrent(); updateStats();
    autoSyncIfEnabled(c);
    if (c.annotation) setTimeout(() => { const f = getFiltered(); if (currentIndex < f.length - 1) { currentIndex++; renderCurrent(); } }, 280);
}

function toggleUncertain() {
    const filtered = getFiltered();
    if (!filtered.length) return;
    const c = filtered[currentIndex];
    c.uncertain = !c.uncertain;
    if (c.uncertain) { c.annotation = null; c.invalid = false; c.invalidReason = ''; }
    else { c.uncertainReason = ''; }
    c.synced = false;
    renderCurrent(); updateStats();
    autoSyncIfEnabled(c);
}

function toggleInvalid() {
    const filtered = getFiltered();
    if (!filtered.length) return;
    const c = filtered[currentIndex];
    c.invalid = !c.invalid;
    if (c.invalid) { c.annotation = null; c.uncertain = false; c.uncertainReason = ''; }
    else { c.invalidReason = ''; }
    c.synced = false;
    renderCurrent(); updateStats();
    autoSyncIfEnabled(c);
}

function saveUncertainReason(v) { const f = getFiltered(); if (f.length) { f[currentIndex].uncertainReason = v; f[currentIndex].synced = false; } }
function saveInvalidReason(v) { const f = getFiltered(); if (f.length) { f[currentIndex].invalidReason = v; f[currentIndex].synced = false; } }

// Debounced sync for reason text
let reasonSyncTimer = null;
document.addEventListener('input', e => {
    if (e.target.closest('.reason-box')) {
        clearTimeout(reasonSyncTimer);
        reasonSyncTimer = setTimeout(() => {
            const filtered = getFiltered();
            if (filtered.length && dataSource === 'bitable' && btState.connected) {
                autoSyncIfEnabled(filtered[currentIndex]);
            }
        }, 1500);
    }
});

// ======================== STATS ========================
function updateStats() {
    const total = allCases.length;
    const done = allCases.filter(c => c.annotation && !c.uncertain && !c.invalid).length;
    const uncertain = allCases.filter(c => c.uncertain).length;
    const invalid = allCases.filter(c => c.invalid).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('doneCount').textContent = done;
    document.getElementById('uncertainCount').textContent = uncertain;
    document.getElementById('invalidCount').textContent = invalid;
    const pct = total ? Math.round((done + uncertain + invalid) / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
}

// ======================== EXPORT ========================
function exportResults() {
    if (!allCases.length) return showToast('暂无数据');
    const rows = allCases.map(c => {
        const aLabel = c.swapped ? 'PrismResult' : 'BaseResult';
        const bLabel = c.swapped ? 'BaseResult' : 'PrismResult';
        let winner = c.annotation === 'good' ? aLabel : c.annotation === 'bad' ? bLabel : c.annotation === 'same' ? 'Same' : '';
        let baseVsPrism = '';
        if (c.annotation) { baseVsPrism = winner === 'BaseResult' ? 'Base更好' : winner === 'PrismResult' ? 'Prism更好' : '一样好'; }
        let status = c.invalid ? '不合适' : c.uncertain ? '不易判断' : c.annotation ? '已标注' : '未标注';
        return {
            'QueryID': c.queryId, 'Query': c.query, 'LogID': c.logId,
            'BaseResult': c.baseResult, 'PrismResult': c.prismResult,
            '盲评A对应': aLabel, '盲评B对应': bLabel,
            '盲评选择': c.annotation === 'good' ? 'A更好' : c.annotation === 'bad' ? 'B更好' : c.annotation === 'same' ? '一样好' : '',
            'BaseVsPrism结论': baseVsPrism,
            '不易判断': c.uncertain ? '是' : '否', '不易判断原因': c.uncertainReason,
            '不合适': c.invalid ? '是' : '否', '不合适原因': c.invalidReason,
            '标注状态': status
        };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length * 2, 14) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '盲评结果');

    // Summary
    const total = allCases.length, done = allCases.filter(c => c.annotation && !c.uncertain && !c.invalid).length;
    const uncertain = allCases.filter(c => c.uncertain).length, invalid = allCases.filter(c => c.invalid).length;
    const baseWin = allCases.filter(c => { if (!c.annotation||c.uncertain||c.invalid) return false; return (c.annotation==='good'&&!c.swapped)||(c.annotation==='bad'&&c.swapped); }).length;
    const prismWin = allCases.filter(c => { if (!c.annotation||c.uncertain||c.invalid) return false; return (c.annotation==='good'&&c.swapped)||(c.annotation==='bad'&&!c.swapped); }).length;
    const sameCount = allCases.filter(c => c.annotation==='same'&&!c.uncertain&&!c.invalid).length;
    const summary = [
        { '指标': '总用例数', '数值': total }, { '指标': '已标注', '数值': done },
        { '指标': '不易判断', '数值': uncertain }, { '指标': '不合适', '数值': invalid },
        { '指标': '未标注', '数值': total-done-uncertain-invalid }, { '指标': '', '数值': '' },
        { '指标': 'Base更好', '数值': baseWin }, { '指标': 'Prism更好', '数值': prismWin },
        { '指标': '一样好', '数值': sameCount },
        { '指标': 'Base胜率', '数值': done ? (baseWin/done*100).toFixed(1)+'%' : '-' },
        { '指标': 'Prism胜率', '数值': done ? (prismWin/done*100).toFixed(1)+'%' : '-' },
    ];
    const ws2 = XLSX.utils.json_to_sheet(summary);
    XLSX.utils.book_append_sheet(wb, ws2, '统计');
    XLSX.writeFile(wb, `盲评结果_${new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')}.xlsx`);
    showToast('导出成功', 'success');
}

// ======================== KEYBOARD ========================
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (document.getElementById('mainContent').style.display === 'none') return;
    switch (e.key) {
        case '1': annotate('good'); break;
        case '2': annotate('same'); break;
        case '3': annotate('bad'); break;
        case '4': toggleUncertain(); break;
        case '5': toggleInvalid(); break;
        case 'ArrowLeft': document.getElementById('prevBtn').click(); break;
        case 'ArrowRight': document.getElementById('nextBtn').click(); break;
    }
});

// ======================== UTILITIES ========================
function renderMd(text) {
    if (!text || !text.trim()) return '<p style="color:var(--text-secondary);font-style:italic;">（无内容）</p>';
    try { return marked.parse(text); } catch { return '<pre>' + esc(text) + '</pre>'; }
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = 'toast', 3000);
}
function confirmReset() { document.getElementById('resetModal').classList.add('show'); }
function closeModal() { document.getElementById('resetModal').classList.remove('show'); }
function doReset() {
    closeModal(); allCases = []; dataSource = 'file';
    btState.connected = false; btState.table = null; btState.fieldMetaList = [];
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('sourceSection').style.display = 'block';
    document.getElementById('fieldMappingSection').style.display = 'none';
    document.getElementById('connectionStatus').className = 'connection-status';
    document.getElementById('connectionStatus').style.display = 'none';
    fileInput.value = '';
}
</script>
